apiVersion: apps/v1
kind: Deployment
metadata: {name: identity, namespace: ongeza, labels: {app: identity}}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: identity}}
  template:
    metadata: {labels: {app: identity}}
    spec:
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: {matchLabels: {app: identity}}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: identity
          image: ongeza/identity
          ports: [{containerPort: 8081, name: http}]
          envFrom: [{secretRef: {name: identity-secrets}}]
          env:
            - {name: DATABASE_URL, value: "jdbc:postgresql://ongeza-db-rw:5432/ongeza_identity?targetServerType=primary"}
            - {name: DATABASE_USERNAME, valueFrom: {secretKeyRef: {name: ongeza-db-app, key: username}}}
            - {name: DATABASE_PASSWORD, valueFrom: {secretKeyRef: {name: ongeza-db-app, key: password}}}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: http}, initialDelaySeconds: 30, periodSeconds: 10}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 768Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: identity, namespace: ongeza}
spec: {selector: {app: identity}, ports: [{port: 8081, targetPort: http}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: identity, namespace: ongeza}
spec: {minAvailable: 2, selector: {matchLabels: {app: identity}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: identity, namespace: ongeza}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: identity}
  minReplicas: 3
  maxReplicas: 12
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
