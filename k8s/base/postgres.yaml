# HA PostgreSQL via CloudNativePG (operator: https://cloudnative-pg.io). 3 instances across zones,
# synchronous replication (no committed transaction lost on failover), continuous WAL archiving.
# Partner databases live here as separate databases; a very large partner can get its own Cluster.
# Prefer a managed service (e.g. Azure Database for PostgreSQL / AWS RDS Multi-AZ) if available in-region.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata: {name: ongeza-db, namespace: ongeza}
spec:
  instances: 3
  minSyncReplicas: 1
  maxSyncReplicas: 1
  primaryUpdateStrategy: unsupervised
  storage: {size: 100Gi, storageClass: premium-ssd}
  affinity: {topologyKey: topology.kubernetes.io/zone}
  bootstrap:
    initdb:
      database: ongeza_platform
      owner: ongeza
      postInitSQL: ["CREATE DATABASE ongeza_identity OWNER ongeza"]
  backup:
    retentionPolicy: "35d"
    barmanObjectStore:
      destinationPath: s3://ongeza-db-backups/
      s3Credentials:
        accessKeyId: {name: backup-credentials, key: ACCESS_KEY_ID}
        secretAccessKey: {name: backup-credentials, key: SECRET_ACCESS_KEY}
      wal: {compression: gzip}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata: {name: ongeza-db-daily, namespace: ongeza}
spec:
  schedule: "0 0 1 * * *"
  cluster: {name: ongeza-db}
