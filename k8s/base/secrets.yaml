# Secrets come from the secret manager (HashiCorp Vault, AWS Secrets Manager or Azure Key Vault)
# through External Secrets Operator (https://external-secrets.io). Nothing secret is committed or
# baked into images. The API reads its secrets as files from SECRETS_DIR (see api.yaml), so values
# never appear in `kubectl describe` or process listings; rotate them in the vault and the
# operator refreshes the Kubernetes secrets within refreshInterval.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: {name: ongeza-vault}
spec:
  provider:
    vault:
      server: https://vault.internal:8200
      path: ongeza
      version: v2
      auth:
        kubernetes: {mountPath: kubernetes, role: ongeza, serviceAccountRef: {name: external-secrets, namespace: external-secrets}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: api-secrets, namespace: ongeza}
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: ongeza-vault}
  target: {name: api-secrets, creationPolicy: Owner}
  # Every key under ongeza/api becomes a file named after it (APP_KEY, DB_PASSWORD, KINGDOM_SIGNING_SECRET,
  # COOP_CONNECT_CONSUMER_SECRET, DARAJA_*, AFRICASTALKING_API_KEY, SMILEID_API_KEY, METRICS_TOKEN, ...).
  dataFrom: [{extract: {key: api}}]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: identity-secrets, namespace: ongeza}
spec:
  refreshInterval: 15m
  secretStoreRef: {kind: ClusterSecretStore, name: ongeza-vault}
  target: {name: identity-secrets, creationPolicy: Owner}
  # JWT_SIGNING_JWK, JWT_PREVIOUS_PUBLIC_JWKS (rotation), PIN_PEPPER, OTP_HMAC_KEY, IDEMPOTENCY_STORAGE_KEY,
  # PLATFORM_ADMIN_KEY, SMS provider keys, SIM_SWAP_CLIENT_SECRET.
  dataFrom: [{extract: {key: identity}}]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: backup-credentials, namespace: ongeza}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: ongeza-vault}
  target: {name: backup-credentials, creationPolicy: Owner}
  dataFrom: [{extract: {key: backups}}]
